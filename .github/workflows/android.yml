name: Build and verify Android APK and AAB
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create a GitHub release with the signed APK and AAB
        type: boolean
        required: false
        default: false
      release_tag:
        description: Tag for the GitHub release
        type: string
        required: false
        default: v0.7.6
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Resolve locked dependencies and test core
        run: |
          python3 tools/dependencies.py
          python3 tools/test.py
      - name: Build signed development APK
        env:
          ANDROID_PLATFORM: android-35
        run: bash build.sh
      - name: Test APK workshop on a real APK
        run: python3 tools/apk-smoke.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare release keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/file-xplorer-release.jks"
          chmod 600 "$RUNNER_TEMP/file-xplorer-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/file-xplorer-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK and AAB
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Publish signed File Xplorer release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: File Xplorer ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed APK and AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: File-Xplorer-signed-APK-AAB
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload development APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: File-Xplorer-development-APK
          path: build/File-Xplorer-v0.7.6.apk
