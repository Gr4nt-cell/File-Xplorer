name: Build and verify Android APK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Resolve locked dependencies and test core
        run: |
          python3 tools/dependencies.py
          python3 tools/test.py
      - name: Build signed development APK
        env:
          ANDROID_PLATFORM: android-35
        run: bash build.sh
      - name: Test APK workshop on a real APK
        run: python3 tools/apk-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: File-Xplorer-development-APK
          path: build/File-Xplorer-v0.7.apk
